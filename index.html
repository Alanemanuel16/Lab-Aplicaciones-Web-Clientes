<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid" style="padding-right: 0;">
    <a class="navbar-brand" id="navBrand" href="#">BOSTON</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" id="navInicio" aria-current="page" href="#">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="navProductos" href="#productos">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" id="navContacto" href="#contacto">Contacto</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2 ms-3 me-auto">
        <div class="position-relative">
          <i class="bi bi-search position-absolute top-50 translate-middle-y ms-2 text-secondary"></i>
          <input id="searchInput" class="form-control" type="search" placeholder="Buscar..." style="width: 190px; padding-left: 2.1rem;">
        </div>
        <div class="dropdown">
          <button class="btn btn-outline-dark dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            Categorias
          </button>
          <ul class="dropdown-menu" id="categoriesMenu">
            <li><a class="dropdown-item" href="#">Todos</a></li>
          </ul>
        </div>
      </div>
      <button class="btn btn-outline-dark border-0 position-relative me-4" type="button" data-bs-toggle="offcanvas"
      data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
    <i class="bi bi-basket3-fill fs-4"></i>
    <span id="cartBadge" class="position-absolute top-50 start-100 translate-middle badge rounded-pill bg-danger">0</span>
      </button>
    </div>
  </div>
</nav>
    </header>

    <main class="container" id="productos">

      <div class="row row-cols-1 row-cols-md-4 g-4 mt-4"  id="products-list">
                <!--generado desde js--> 


</div>

      <section id="contacto" class="mt-5 mb-5 d-none">
        <div class="row g-4">
          <div class="col-md-5">
            <ul class="list-unstyled d-flex flex-column gap-3">
              <li class="d-flex align-items-center gap-3">
                <i class="bi bi-whatsapp fs-3 text-success"></i>
                <span class="fs-5">+54 11 1234-5678</span>
              </li>
              <li class="d-flex align-items-center gap-3">
                <i class="bi bi-telephone fs-4 text-dark"></i>
                <span class="fs-5">+54 11 8765-4321</span>
              </li>
              <li class="d-flex align-items-center gap-3">
                <i class="bi bi-clock fs-4 text-dark"></i>
                <span class="fs-5">Lunes a Viernes de 9 a 18hs</span>
              </li>
            </ul>
            <div class="bg-success text-white text-center rounded-3 py-3 fw-semibold fs-5 mt-4">
              Escribenos por WhatsApp
            </div>
          </div>
          <div class="col-md-7">
            <form class="d-flex flex-column gap-3">
              <div>
                <label for="contactName" class="form-label">Tu nombre</label>
                <input type="text" class="form-control" id="contactName" placeholder="Escribe tu nombre...">
              </div>
              <div>
                <label for="contactEmail" class="form-label">Tu correo electronico</label>
                <input type="email" class="form-control" id="contactEmail" placeholder="Escribe tu correo electronico...">
              </div>
              <div>
                <label for="contactSubject" class="form-label">Asunto</label>
                <input type="text" class="form-control" id="contactSubject" placeholder="Escribe el asunto...">
              </div>
              <div>
                <label for="contactMessage" class="form-label">Tu mensaje (opcional)</label>
                <textarea class="form-control" id="contactMessage" rows="4" placeholder="Escribe tu mensaje..."></textarea>
              </div>
            </form>
          </div>
        </div>
      </section>

      <!-- Modal -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
</div>

      <!-- Toast confirmación carrito -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="cartToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">Carrito</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body">
            Producto agregado al carrito. Productos guardados: <span id="cartCount">0</span>
        </div>
    </div>
</div>
    </main>
    <footer class="text-center py-3">
        <p class="mb-0">&copy; 2026: Derechos de BOSTON</p>
    </footer>

    <!-- Offcanvas carrito -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasRightLabel">Carrito de compras</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div id="cart-container">
                <p class="text-muted">El carrito está vacío.</p>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./src/index.js"></script>
    
  </body>
</html>
